[project]
name = "360nrs-api"
version = "0.1.0"
description = "FastAPI wrapper and test harness for the 360nrs SMS API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
cache_dir = ".pytest_cache"
markers = [
    "live: performs real 360nrs operations using the configured credentials",
]

[tool.uv]
package = false
